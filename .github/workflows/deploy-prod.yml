name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # a manual run, a new branch or a force push has no base to diff against, so the API deploys
      - name: Detect API changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null || ! git diff --quiet "$BEFORE" HEAD -- api/ packages/constants/ pnpm-lock.yaml; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

      # version comes from packageManager in package.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - name: Build frontend
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_UPDOWN_API_KEY: ${{ vars.VITE_UPDOWN_API_KEY }}
        run: |
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it under Settings > Secrets and variables > Actions > Variables."
              exit 1
            fi
          done
          pnpm build

      - name: Check API bundle
        if: steps.changes.outputs.api == 'true'
        working-directory: api
        run: pnpm exec wrangler deploy --env production --dry-run

      # functions/ (the /api proxy) ships with the site, so it travels with dist/
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: |
            web/dist
            web/functions
          include-hidden-files: true

  production:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://baileysanalytics.com
    # never run two production deploys at once; a queued one waits for the first
    concurrency:
      group: production
    steps:
      # wrangler is installed in api/ and bundles the worker from source
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8
        with:
          name: web
          path: web

      # API first: the frontend changes expect the API's new behavior, and the API's
      # changes are backward-compatible with the frontend that's live now.
      - name: Deploy API
        if: needs.build.outputs.api == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production --var COMMIT_SHA:${{ github.sha }}

      - name: Deploy frontend
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler looks for functions/ (the /api proxy) in the directory it runs in, so
        # it must run from web/; wrangler itself is installed in api/
        run: >-
          ../api/node_modules/.bin/wrangler pages deploy dist
          --project-name=baileys-dashboard --branch=main
          --commit-hash="${{ github.sha }}" --commit-message="deploy ${{ github.sha }}"

      # an unauthenticated /api call must get the worker's JSON 401, not the SPA's HTML.
      # retries give the new deployment time to reach every edge.
      - name: Check the /api proxy reaches the worker
        run: |
          for attempt in 1 2 3 4 5 6; do
            type=$(curl -sS -o /tmp/body -w '%{content_type}' https://baileysanalytics.com/api/auth/me || true)
            case "$type" in
              application/json*) echo "proxy ok: $(cat /tmp/body)"; exit 0 ;;
            esac
            echo "attempt $attempt: got '$type', retrying in 10s"
            sleep 10
          done
          echo "::error::/api is serving the SPA instead of proxying to the worker; functions/ was not deployed"
          exit 1

      - name: Smoke test
        env:
          API_DEPLOYED: ${{ needs.build.outputs.api }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 https://baileys-analytics-api-production.nicosalm.workers.dev/health
          curl -fsS --retry 3 --retry-delay 5 -o /dev/null https://baileysanalytics.com
          # an unchanged API keeps reporting the commit it was last deployed from
          [ "$API_DEPLOYED" = true ] || exit 0
          # the worker, reached through the site's proxy, must report the commit this run just deployed;
          # retries cover edge propagation
          for attempt in 1 2 3 4 5 6; do
            deployed=$(curl -fsS https://baileysanalytics.com/api | jq -r .commit || true)
            [ "$deployed" = "${{ github.sha }}" ] && { echo "worker at $deployed"; exit 0; }
            echo "attempt $attempt: worker reports '$deployed', retrying in 10s"
            sleep 10
          done
          echo "::error::worker reports commit $deployed, expected ${{ github.sha }}"
          exit 1
