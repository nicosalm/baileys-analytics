name = "baileys-analytics-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# uncomment after creating kv namespace with: wrangler kv namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "cache_namespace_id_placeholder"

# [triggers]
# crons = []  # No scheduled jobs needed with webhook-based syncing

[vars]
FRONTEND_URL = "http://localhost:5173"


[env.production]
name = "baileys-analytics-api-production"

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "7d9626e159cb4c97b4c9912ddf0523fe"

[env.production.vars]
FRONTEND_URL = "https://baileys-dashboard.pages.dev"
# Webhook credentials are stored as secrets via wrangler secret put
# See setup-webhooks.md for deployment instructions

[env.staging]
name = "baileys-analytics-api-staging"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "STAGING_KV_NAMESPACE_ID"

[env.staging.vars]
FRONTEND_URL = "https://staging.dashboard.baileys.com"