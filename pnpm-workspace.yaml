packages:
  - apps/*
  - packages/*

# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds;
# unlisted packages with build scripts fail the install
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  azure-functions-core-tools: true
  supabase: true
  core-js: false
  msw: false
