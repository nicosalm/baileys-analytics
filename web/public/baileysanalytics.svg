<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 3 56 56">
  <title>Baileys Analytics</title>
  <style>
  .fg {
    fill: #1d3b5c;
  }
  .water {
    fill: #86a5c3;
  }
  @media (prefers-color-scheme: dark) {
    .fg {
      fill: #e9eef4;
    }
    .water {
      fill: #6f8fb0;
