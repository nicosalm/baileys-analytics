  }
  </style>
  <clipPath id="sun"><circle cx="32" cy="31" r="27" /></clipPath>
  <g clip-path="url(#sun)">
    <rect class="fg" x="5" y="27" width="15" height="14" />
    <rect class="fg" x="24.5" y="17" width="15" height="24" />
    <rect class="fg" x="44" y="0" width="15" height="41" />
    <rect class="water" x="0" y="45.5" width="64" height="12" />
