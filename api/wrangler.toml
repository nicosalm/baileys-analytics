name = "baileys-analytics-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[limits]
cpu_ms = 300_000
subrequests = 10_000

# the cron reconciles each renewal with the property count and pushes the new
# price into Stripe shortly before it bills. Hourly cadence is required: the
# lead-time gate in reconcileRenewals is 2 hours, and every renewal needs at
# least one run inside that window or it bills at the old price for another
# cycle. See src/scheduled.ts and CRON_LEAD_TIME_MS in services/tier-reconciliation.ts.
[triggers]
crons = ["0 * * * *"]

[vars]
FRONTEND_URL = "http://localhost:5173"
ADMIN_EMAILS = "nico@baileysanalytics.com,admin@baileysanalytics.com,martina@doorcountystay.com,jerry@doorcountystay.com"

[env.production]
name = "baileys-analytics-api-production"

[env.production.limits]
cpu_ms = 300_000
subrequests = 10_000

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "7d9626e159cb4c97b4c9912ddf0523fe"

[env.production.vars]
FRONTEND_URL = "https://baileysanalytics.com"
ADMIN_EMAILS = "admin@baileysanalytics.com,martina@doorcountystay.com,jerry@doorcountystay.com"
