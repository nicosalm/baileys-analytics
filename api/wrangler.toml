name = "baileys-analytics-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[limits]
cpu_ms = 300_000
subrequests = 10_000

# cron pushes pending tier upgrades into Stripe shortly before each customer's
# renewal. Hourly cadence is required: the lead-time gate in
# applyPendingTierUpgrades is 2 hours, and we need at least one cron run inside
# that window for every renewal — otherwise a customer can get billed at the
# old price for an entire extra cycle. See src/scheduled.ts and
# CRON_LEAD_TIME_MS in services/tier-reconciliation.ts.
[triggers]
crons = ["0 * * * *"]

[vars]
FRONTEND_URL = "http://localhost:5173"
ADMIN_EMAILS = "nico@baileysanalytics.com,admin@baileysanalytics.com,martina@doorcountystay.com,jerry@doorcountystay.com"

[env.production]
name = "baileys-analytics-api-production"

[env.production.limits]
cpu_ms = 300_000
subrequests = 10_000

[[env.production.kv_namespaces]]
binding = "CACHE"
id = "7d9626e159cb4c97b4c9912ddf0523fe"

[env.production.vars]
FRONTEND_URL = "https://baileysanalytics.com"
ADMIN_EMAILS = "admin@baileysanalytics.com,demo@baileysanalytics.com,martina@doorcountystay.com,jerry@doorcountystay.com"
